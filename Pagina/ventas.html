<script src="carrito-manager.js"></script>
<script>
let subtotal = 0;

function cargarProductos() {
    const items = window.carrito.items;
    const contenedor = document.getElementById('contenedor-productos');
    
    if (items.length === 0) {
        contenedor.innerHTML = '<div class="text-center py-8 text-gray-500">No hay productos en el carrito</div>';
        setTimeout(() => {
            window.location.href = 'catalogo.php';
        }, 2000);
        return;
    }
    
    let html = '';
    subtotal = 0;
    
    items.forEach(item => {
        const subtotalItem = item.precio * item.cantidad;
        subtotal += subtotalItem;
        
        html += `
        <div class="flex items-center gap-4 bg-gray-50 dark:bg-[#21314a] p-4 rounded-lg">
            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-16" style="background-image: url('${item.imagen}');"></div>
            <div class="flex-1">
                <p class="text-gray-900 dark:text-white text-base font-semibold">${item.nombre}</p>
                <p class="text-gray-600 dark:text-gray-400 text-sm">Cantidad: ${item.cantidad}</p>
            </div>
            <div class="text-right">
                <p class="text-gray-900 dark:text-white font-bold text-lg">$${subtotalItem.toFixed(2)}</p>
                <p class="text-gray-500 dark:text-gray-400 text-sm">$${item.precio.toFixed(2)} c/u</p>
            </div>
        </div>
        `;
    });
    
    contenedor.innerHTML = html;
    calcularTotal();
}

function calcularTotal() {
    const metodoSeleccionado = document.querySelector('input[name="payment"]:checked').value;
    let porcentajeInteres = 0;
    
    if (metodoSeleccionado === 'credito') {
        porcentajeInteres = 10;
    } else if (metodoSeleccionado === 'debito') {
        porcentajeInteres = 5;
    } else {
        porcentajeInteres = 0;
    }
    
    const interes = subtotal * (porcentajeInteres / 100);
    const total = subtotal + interes;
    
    document.getElementById('subtotal-display').textContent = '$' + subtotal.toFixed(2);
    document.getElementById('porcentaje-interes').textContent = porcentajeInteres;
    document.getElementById('interes-display').textContent = '$' + interes.toFixed(2);
    document.getElementById('total-display').textContent = '$' + total.toFixed(2);
}

function completarCompra() {
    const metodoSeleccionado = document.querySelector('input[name="payment"]:checked').value;
    const metodosTexto = {
        'efectivo': 'Efectivo',
        'credito': 'Tarjeta de Crédito',
        'debito': 'Tarjeta de Débito',
        'transferencia': 'Transferencia Bancaria'
    };
    
    const items = window.carrito.items;
    const porcentajeInteres = metodoSeleccionado === 'credito' ? 10 : (metodoSeleccionado === 'debito' ? 5 : 0);
    const interes = subtotal * (porcentajeInteres / 100);
    const total = subtotal + interes;
    const datosVenta = {
        subtotal: subtotal,
        interes: interes,
        total: total,
        metodo_pago: metodosTexto[metodoSeleccionado],
        productos: items
    };
    
    fetch('procesar_venta.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(datosVenta)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            document.getElementById('modal-total').textContent = '$' + total.toFixed(2);
            document.getElementById('modal-metodo').textContent = metodosTexto[metodoSeleccionado];
            document.getElementById('confirmation-modal').classList.remove('hidden');
            
            window.carrito.vaciarCarrito();
        } else {
            alert('Error al procesar la compra: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error al procesar la compra. Intente nuevamente.');
    });
}

function nuevaCompra() {
    document.getElementById('confirmation-modal').classList.add('hidden');
    window.location.href = 'catalogo.php';
}

function volverInicio() {
    document.getElementById('confirmation-modal').classList.add('hidden');
    window.location.href = 'inicio.php';
}

document.addEventListener('DOMContentLoaded', cargarProductos);
</script>
